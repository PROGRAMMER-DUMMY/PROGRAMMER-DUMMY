<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ConsolasFallback,Consolas,monospace" width="1105px" height="500px" font-size="13px">
<style>
@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}
.k{fill:#ffa657}.v{fill:#a5d6ff}.c{fill:#616e7f}.h{fill:#58a6ff;font-weight:bold}.s{fill:#8b949e}.g{fill:#3fb950}.a{fill:#c9d1d9}
text,tspan{white-space:pre}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes si{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes bk{0%,50%{opacity:1}51%,100%{opacity:0}}
.aa{animation:fi 1.2s ease-in-out}
.il1{animation:si .4s ease-out 0.23s both}
.il2{animation:si .4s ease-out 0.31s both}
.il3{animation:si .4s ease-out 0.39s both}
.il4{animation:si .4s ease-out 0.47s both}
.il5{animation:si .4s ease-out 0.55s both}
.il6{animation:si .4s ease-out 0.63s both}
.il7{animation:si .4s ease-out 0.71s both}
.il8{animation:si .4s ease-out 0.79s both}
.il9{animation:si .4s ease-out 0.87s both}
.il10{animation:si .4s ease-out 0.95s both}
.il11{animation:si .4s ease-out 1.03s both}
.il12{animation:si .4s ease-out 1.11s both}
.il13{animation:si .4s ease-out 1.19s both}
.il14{animation:si .4s ease-out 1.27s both}
.il15{animation:si .4s ease-out 1.35s both}
.il16{animation:si .4s ease-out 1.43s both}
.il17{animation:si .4s ease-out 1.51s both}
.il18{animation:si .4s ease-out 1.59s both}
.il19{animation:si .4s ease-out 1.67s both}
.il20{animation:si .4s ease-out 1.75s both}
.il21{animation:si .4s ease-out 1.83s both}
.il22{animation:si .4s ease-out 1.91s both}
.il23{animation:si .4s ease-out 1.99s both}
.il24{animation:si .4s ease-out 2.07s both}
.il25{animation:si .4s ease-out 2.15s both}
.il26{animation:si .4s ease-out 2.23s both}
.il27{animation:si .4s ease-out 2.31s both}
.il28{animation:si .4s ease-out 2.39s both}
.il29{animation:si .4s ease-out 2.47s both}
.cr{animation:bk 1s step-end infinite;fill:#58a6ff}
.ticker{animation:tk 16s linear infinite}@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-725px)}}
</style>
