<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="560px" font-size="14px">
<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  size-adjust: 109%;
}
.key {fill: #bf8700;}
.value {fill: #0550ae;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #8c959f;}
.header {fill: #0969da; font-weight: bold;}
.separator {fill: #afb8c1;}
.badge {fill: #1a7f37;}
text, tspan {white-space: pre;}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.ascii-art { animation: fadeIn 1.5s ease-in-out; }
.info-line-1 { animation: slideIn 0.5s ease-out 0.3s both; }
.info-line-2 { animation: slideIn 0.5s ease-out 0.5s both; }
.info-line-3 { animation: slideIn 0.5s ease-out 0.7s both; }
.info-line-4 { animation: slideIn 0.5s ease-out 0.9s both; }
.info-line-5 { animation: slideIn 0.5s ease-out 1.1s both; }
.info-line-6 { animation: slideIn 0.5s ease-out 1.3s both; }
.info-line-7 { animation: slideIn 0.5s ease-out 1.5s both; }
.info-line-8 { animation: slideIn 0.5s ease-out 1.7s both; }
.info-line-9 { animation: slideIn 0.5s ease-out 1.9s both; }
.info-line-10 { animation: slideIn 0.5s ease-out 2.1s both; }
