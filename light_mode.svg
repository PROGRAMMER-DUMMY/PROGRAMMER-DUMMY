.info-line-12 { animation: slideIn 0.5s ease-out 2.5s both; }
.info-line-13 { animation: slideIn 0.5s ease-out 2.7s both; }
.info-line-14 { animation: slideIn 0.5s ease-out 2.9s both; }
.info-line-15 { animation: slideIn 0.5s ease-out 3.1s both; }
.info-line-16 { animation: slideIn 0.5s ease-out 3.3s both; }
.info-line-17 { animation: slideIn 0.5s ease-out 3.5s both; }
.info-line-18 { animation: slideIn 0.5s ease-out 3.7s both; }
.info-line-19 { animation: slideIn 0.5s ease-out 3.9s both; }
.info-line-20 { animation: slideIn 0.5s ease-out 4.1s both; }
.cursor {
  animation: blink 1s step-end infinite;
  fill: #0969da;
}
</style>
